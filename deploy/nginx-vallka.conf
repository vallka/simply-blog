server {
    listen 80;
    server_name vallka.com www.vallka.com lucas.vallka.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name vallka.com www.vallka.com lucas.vallka.com;

    # Self-signed until the DNS moves, then certbot --nginx replaces these two
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    client_max_body_size 20m;

    location /static/ {
        alias /home/ubuntu/vallka/simply-blog/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /home/ubuntu/vallka/media/;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
