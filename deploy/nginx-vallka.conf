# Any other name, or no SNI (scanners using the bare IP): refuse TLS, so they
# never reach Django (they used to get a 500 from the Sites lookup)
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name vallka.com www.vallka.com lucas.vallka.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vallka.com www.vallka.com lucas.vallka.com;

    ssl_certificate /etc/letsencrypt/live/vallka.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vallka.com/privkey.pem; # managed by Certbot

    client_max_body_size 20m;

    location /static/ {
        alias /home/ubuntu/vallka/simply-blog/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /home/ubuntu/vallka/media/;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
